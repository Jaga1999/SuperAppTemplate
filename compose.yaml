# SuperApp: production-shaped stack.
#   Only nginx is published. Everything else lives on private networks.
#   Dev conveniences (localhost ports for DB, Keycloak admin, Mailpit UI, …) live in compose.override.yaml,
#   which `docker compose up` loads automatically. Production: `docker compose -f compose.yaml up -d`.

name: superapp

x-restart: &restart
  restart: unless-stopped

services:
  # ── Edge ───────────────────────────────────────────────────────────────────
  nginx:
    <<: *restart
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    image: superapp/nginx:local
    environment:
      BACKEND_UPSTREAM: backend:8081
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge]
    read_only: true
    # Read-only root FS; writable scratch space owned by the unprivileged nginx user (uid 101).
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0700
      - /var/run:uid=101,gid=101,mode=0700
      - /tmp:uid=101,gid=101,mode=0700
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── BFF (the only thing that talks to Keycloak) ─────────────────────────────
  backend:
    <<: *restart
    build:
      context: backend
    image: superapp/backend:local
    # Least privilege: only what the BFF needs (never the Keycloak DB or admin credentials).
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PUBLIC_URL: ${PUBLIC_URL}
      APP_DB_URL: jdbc:postgresql://postgres:5432/${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      SUPERAPP_BFF_CLIENT_ID: ${SUPERAPP_BFF_CLIENT_ID}
      SUPERAPP_BFF_CLIENT_SECRET: ${SUPERAPP_BFF_CLIENT_SECRET}
      SUPERAPP_ADMIN_CLIENT_ID: ${SUPERAPP_ADMIN_CLIENT_ID}
      SUPERAPP_ADMIN_CLIENT_SECRET: ${SUPERAPP_ADMIN_CLIENT_SECRET}
      SUPERAPP_GOOGLE_LOGIN_ENABLED: ${SUPERAPP_GOOGLE_LOGIN_ENABLED}
      BFF_COOKIE_ENCRYPTION_KEY: ${BFF_COOKIE_ENCRYPTION_KEY}
      BFF_COOKIE_SECURE: ${BFF_COOKIE_SECURE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [edge, internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/actuator/health/readiness | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s

  # ── Identity (private) ──────────────────────────────────────────────────────
  keycloak:
    <<: *restart
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    image: superapp/keycloak:local
    command: ["start", "--optimized", "--import-realm"]
    # Least privilege: Keycloak gets its own DB credentials + the values referenced by realm/superapp-realm.json.
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      SUPERAPP_BFF_CLIENT_SECRET: ${SUPERAPP_BFF_CLIENT_SECRET}
      SUPERAPP_ADMIN_CLIENT_SECRET: ${SUPERAPP_ADMIN_CLIENT_SECRET}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SUPERAPP_GOOGLE_LOGIN_ENABLED: ${SUPERAPP_GOOGLE_LOGIN_ENABLED}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_DISPLAY_NAME: ${SMTP_FROM_DISPLAY_NAME}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_AUTH: ${SMTP_AUTH}
      SMTP_STARTTLS: ${SMTP_STARTTLS}
      SMTP_SSL: ${SMTP_SSL}
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Browsers only ever reach Keycloak through nginx → BFF → /auth/**
      KC_HOSTNAME: ${PUBLIC_URL}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      KC_LOG_LEVEL: info
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_EVENTS_TOPIC: keycloak.events
      SUPERAPP_BACKCHANNEL_LOGOUT_URL: http://backend:8081/api/auth/backchannel-logout
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3 &&
          exec 4<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /auth/realms/superapp/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&4 &&
          head -1 <&4 | grep -q ' 200 '
      # Ready = server UP *and* realm import finished (Keycloak imports in the background after reporting UP).
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 40s

  # ── Data (private) ──────────────────────────────────────────────────────────
  postgres:
    <<: *restart
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -tAc \"select 1 from pg_database where datname='${KEYCLOAK_DB_NAME}'\" | grep -q 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    <<: *restart
    image: redis:8.10.2
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  kafka:
    <<: *restart
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: superapp-kraft-cluster-0001
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Topics are declared by the backend (KafkaAdmin, idempotent at startup), never auto-created by producers.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.31.4
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    networks: [internal]

volumes:
  postgres-data:
  redis-data:
  kafka-data:

networks:
  edge:
  internal:
