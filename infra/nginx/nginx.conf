worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Keycloak + BFF cookies can be large (encrypted auth-request cookie, tokens).
    large_client_header_buffers 8 32k;
    client_max_body_size 1m;

    # Never log query strings or cookies (OAuth codes/state live there).
    log_format edge '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time "$http_user_agent" rid=$request_id';
    access_log /dev/stdout edge;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Edge rate limits (the BFF applies finer, per-user limits in Redis).
    limit_req_zone $binary_remote_addr zone=edge_api:20m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=edge_auth:20m rate=5r/s;
    # Static, immutable theme assets (JS chunks, CSS, fonts): one login page pulls dozens of them at once.
    limit_req_zone $binary_remote_addr zone=edge_static:20m rate=100r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=edge_conn:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
