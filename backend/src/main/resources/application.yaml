# ─────────────────────────────────────────────────────────────────────────────
# SuperApp BFF. Defaults target `docker compose up` with the backend run from the IDE
# (services on localhost via compose.override.yaml). The `docker` profile overrides for in-container runs.
# Every secret comes from the environment (.env). Nothing secret is committed.
# ─────────────────────────────────────────────────────────────────────────────
spring:
  application:
    name: superapp-backend
  cloud:
    gateway:
      server:
        webmvc:
          # Keycloak must see the browser's IP/host/scheme (sessions page, events, emails, brute-force detection).
          # Without trusted-proxies the gateway strips every X-Forwarded-* header. Trusting all is correct ONLY because
          # the BFF is never exposed directly: nginx is the sole ingress and overwrites X-Forwarded-For with $remote_addr.
          # The values are generated from the request Spring already resolved (forward-headers-strategy: framework).
          trusted-proxies: ".*"
          # Keycloak reads X-Forwarded-* (KC_PROXY_HEADERS=xforwarded); don't send a second, RFC 7239 "Forwarded" copy.
          forwarded-request-headers-filter:
            enabled: false
  threads:
    virtual:
      enabled: true            # Java 25 virtual threads for Tomcat, @Scheduled, Kafka listeners
  main:
    keep-alive: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5432/superapp}
    username: ${APP_DB_USER:superapp}
    password: ${APP_DB_PASSWORD:}
    # Virtual threads make requests cheap; the pool is the real concurrency limit for the database.
    # Size it against Postgres max_connections across all instances: instances × maximum-pool-size < max_connections.
    hikari:
      pool-name: superapp
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 5000       # ms: fail fast instead of piling up waiting requests
      validation-timeout: 2000
      idle-timeout: 300000           # 5 min
      max-lifetime: 1800000          # 30 min, below any firewall/LB idle cut-off
      keepalive-time: 120000         # 2 min liveness ping on idle connections
      data-source-properties:
        ApplicationName: superapp-backend   # shows up in pg_stat_activity
        reWriteBatchedInserts: true         # multi-row INSERTs for JDBC batches
        tcpKeepAlive: true
        connectTimeout: 5                   # seconds
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none           # Flyway owns the schema
    properties:
      hibernate:
        jdbc.time_zone: UTC
        timezone.default_storage: NORMALIZE_UTC
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        query.in_clause_parameter_padding: true                    # fewer distinct plans for IN (...) lists
        query.fail_on_pagination_over_collection_fetch: true       # never paginate in memory
  flyway:
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
      client-name: superapp-backend
      connect-timeout: 2s
      timeout: 2s              # command timeout; Lettuce shares one multiplexed connection (no pool needed)
      lettuce:
        shutdown-timeout: 200ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    client-id: superapp-backend
    producer:
      acks: all
      compression-type: lz4
      properties:
        enable.idempotence: true
        linger.ms: 5
        max.block.ms: 5000             # never hang a caller when the broker is unreachable
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
    consumer:
      auto-offset-reset: earliest
      max-poll-records: 100
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
      concurrency: 3                   # one consumer per partition (topics have 3)
      observation-enabled: true

  mvc:
    problemdetails:
      enabled: true

server:
  port: 8081
  forward-headers-strategy: framework   # trust nginx's X-Forwarded-* (nginx is the only ingress)
  shutdown: graceful
  # Keycloak's own session cookies (several JWTs) + our encrypted token cookies travel together on /auth/** requests.
  max-http-request-header-size: 32KB
  error:
    include-stacktrace: never
    include-message: never

management:
  server:
    port: 9090                          # never exposed by nginx
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  observations:
    key-values:
      application: superapp-backend

logging:
  level:
    root: info
    com.superapp: info
  pattern:
    correlation: "[%X{requestId:-}] "

# API description + Swagger UI on the BFF's own port. nginx routes only /api, /oauth2, /login/oauth2 and /auth to the
# BFF, so these paths are never public. Dev (compose.override.yaml publishes 8081 on localhost):
#   http://localhost:8081/swagger-ui.html   ·   http://localhost:8081/v3/api-docs
springdoc:
  paths-to-match: /api/**
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: false   # the API needs the browser session + CSRF header of the real app
  default-produces-media-type: application/json

superapp:
  bff:
    public-url: ${PUBLIC_URL:http://localhost:8080}
    encryption-key: ${BFF_COOKIE_ENCRYPTION_KEY:}
    default-return-path: /app
    revocation-ttl: PT15M
    cookies:
      secure: ${BFF_COOKIE_SECURE:true}
    keycloak:
      internal-url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180/auth}
      realm: ${KEYCLOAK_REALM:superapp}
      client-id: ${SUPERAPP_BFF_CLIENT_ID:superapp-bff}
      client-secret: ${SUPERAPP_BFF_CLIENT_SECRET:}
      admin-client-id: ${SUPERAPP_ADMIN_CLIENT_ID:superapp-admin-api}
      admin-client-secret: ${SUPERAPP_ADMIN_CLIENT_SECRET:}
    rate-limit:
      enabled: true
      reads-per-minute: 300
      writes-per-minute: 60
      auth-per-minute: 20
      login-pages-per-minute: 60
  identity:
    google-login-enabled: ${SUPERAPP_GOOGLE_LOGIN_ENABLED:false}
    events:
      # Keycloak's own Kafka cluster (separate from spring.kafka.*, which is the app's cluster).
      bootstrap-servers: ${KEYCLOAK_KAFKA_BOOTSTRAP_SERVERS:localhost:9095}
  kafka:
    topics:
      keycloak-events: keycloak.events

---
spring:
  config:
    activate:
      on-profile: docker
logging:
  structured:
    format:
      console: ecs
